[env:esp32s3box3]
; Arduino 3.x provides ESP_I2S.h / I2SClass used by src/main.cpp.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
board = esp32s3box
framework = arduino
monitor_speed = 115200
; Use the board's 16 MB flash layout to accommodate bundled CJK fonts.
board_build.partitions = default_16MB.csv

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    tzapu/WiFiManager @ 2.0.17
    bblanchon/ArduinoJson @ ^7.4.2
