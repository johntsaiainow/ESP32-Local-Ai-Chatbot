[platformio]
default_envs = esp32s3box3

[env]
; Arduino 3.x for the native ESP-IDF I2S channel API.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    tzapu/WiFiManager @ 2.0.17
    bblanchon/ArduinoJson @ ^7.4.2

[env:esp32s3box3]
board = esp32s3box
board_build.partitions = default_16MB.csv
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX @ ^1.1.16

[env:lichuang_s3]
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DOSIRIS_LICHUANG_S3
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX @ ^1.1.16

[m5]
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified @ 0.2.26
    m5stack/M5GFX @ 0.2.31
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:cores3]
board = m5stack-cores3
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = ${m5.build_flags} -DOSIRIS_CORE_S3
lib_deps = ${m5.lib_deps}

[env:atoms3r_echo]
; AtomS3R (8 MB flash + 8 MB octal PSRAM), not the original AtomS3.
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.partitions = partitions/osiris_8MB.csv
board_build.arduino.memory_type = qio_opi
build_flags = ${m5.build_flags} -DOSIRIS_ATOM_S3R
lib_deps = ${m5.lib_deps}
